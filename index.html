<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Seminar Student Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <header class="header">
                <p class="eyebrow">LABORATORY ACTIVITY #3</p>
                <h1>Student Registration Form</h1>
                <p>Register for the upcoming IT seminar. All fields must be completed correctly.</p>
            </header>

            <form id="registrationForm" novalidate>
                <div class="form-grid">
                    <div class="field full-width">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName"
                               autocomplete="name" aria-describedby="fullNameError">
                        <p class="error" id="fullNameError" role="alert"></p>
                    </div>

                    <div class="field">
                        <label for="studentNumber">Student Number</label>
                        <input type="text" id="studentNumber" name="studentNumber"
                               placeholder="24-1234-123" aria-describedby="studentNumberError">
                        <p class="error" id="studentNumberError" role="alert"></p>
                    </div>

                    <div class="field">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email"
                               autocomplete="email" aria-describedby="emailError">
                        <p class="error" id="emailError" role="alert"></p>
                    </div>

                    <div class="field">
                        <label for="mobileNumber">Mobile Number</label>
                        <input type="tel" id="mobileNumber" name="mobileNumber"
                               placeholder="09171234567" aria-describedby="mobileNumberError">
                        <p class="error" id="mobileNumberError" role="alert"></p>
                    </div>

                    <div class="field">
                        <label for="course">Course</label>
                        <select id="course" name="course" aria-describedby="courseError">
                            <option value="" selected>Select your course.</option>
                            <option value="BSIT">BSIT</option>
                            <option value="BSCS">BSCS</option>
                        </select>
                        <p class="error" id="courseError" role="alert"></p>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password"
                               autocomplete="new-password" aria-describedby="passwordError passwordFeedback">
                        <p class="feedback" id="passwordFeedback" aria-live="polite"></p>
                        <p class="error" id="passwordError" role="alert"></p>
                    </div>

                    <div class="field">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword"
                               autocomplete="new-password" aria-describedby="confirmPasswordError">
                        <p class="error" id="confirmPasswordError" role="alert"></p>
                    </div>

                    <div class="field full-width checkbox-field">
                        <div class="checkbox-row">
                            <input type="checkbox" id="terms" name="terms" aria-describedby="termsError">
                            <label for="terms">I agree to the terms and conditions.</label>
                        </div>
                        <p class="error" id="termsError" role="alert"></p>
                    </div>
                </div>

                <div class="actions">
                    <button type="submit" id="registerBtn">Register</button>
                    <button type="reset" id="resetBtn" class="secondary">Reset</button>
                </div>
            </form>

            <div id="successMessage" class="success" role="status" aria-live="polite"></div>

            <section id="registrationSummary" class="summary" aria-labelledby="summaryTitle" hidden>
                <h2 id="summaryTitle">Registration Summary</h2>
                <dl>
                    <div><dt>Full Name</dt><dd id="summaryName"></dd></div>
                    <div><dt>Student Number</dt><dd id="summaryStudentNumber"></dd></div>
                    <div><dt>Email</dt><dd id="summaryEmail"></dd></div>
                    <div><dt>Mobile Number</dt><dd id="summaryMobileNumber"></dd></div>
                    <div><dt>Course</dt><dd id="summaryCourse"></dd></div>
                </dl>
            </section>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html
