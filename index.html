<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <div class="registration-card">

            <h1>Student Registration Form</h1>

            <p class="description">
                Register for the upcoming IT seminar.
                Please complete all required fields.
            </p>

            <form id="registrationForm">

                <!-- Full Name -->
                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        required
                        aria-describedby="fullNameError"
                    >

                    <p
                        id="fullNameError"
                        class="error-message"
                        aria-live="polite"
                    ></p>

                </div>


                <!-- Student Number -->
                <div class="form-group">

                    <label for="studentNumber">
                        Student Number
                    </label>

                    <input
                        type="text"
                        id="studentNumber"
                        name="studentNumber"
                        placeholder="24-1234-123"
                        required
                        aria-describedby="studentNumberError"
                    >

                    <p
                        id="studentNumberError"
                        class="error-message"
                        aria-live="polite"
                    ></p>

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        aria-describedby="emailError"
                    >

                    <p
                        id="emailError"
                        class="error-message"
                        aria-live="polite"
                    ></p>

                </div>


                <!-- Mobile Number -->
                <div class="form-group">

                    <label for="mobileNumber">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobileNumber"
                        name="mobileNumber"
                        placeholder="09171234567"
                        required
                        aria-describedby="mobileNumberError"
                    >

                    <p
                        id="mobileNumberError"
                        class="error-message"
                        aria-live="polite"
                    ></p>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        aria-describedby="passwordFeedback passwordError"
                    >

                    <p
                        id="passwordFeedback"
                        class="password-feedback"
                        aria-live="polite"
                    ></p>

                    <p
                        id="passwordError"
                        class="error-message"
                        aria-live="polite"
                    ></p>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        required
                        aria-describedby="confirmPasswordError"
                    >

                    <p
                        id="confirmPasswordError"
                        class="error-message"
                        aria-live="polite"
                    ></p>

                </div>


                <!-- Course -->
                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <select
                        id="course"
                        name="course"
                        required
                        aria-describedby="courseError"
                    >

                        <option value="">
                            Select your course
                        </option>

                        <option value="BSIT">
                            BSIT
                        </option>

                        <option value="BSCS">
                            BSCS
                        </option>

                    </select>

                    <p
                        id="courseError"
                        class="error-message"
                        aria-live="polite"
                    ></p>

                </div>


                <!-- Terms Agreement -->
                <div class="terms-group">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                        aria-describedby="termsError"
                    >

                    <label for="terms">
                        I agree to the terms and conditions.
                    </label>

                    <p
                        id="termsError"
                        class="error-message"
                        aria-live="polite"
                    ></p>

                </div>


                <!-- Success Message -->
                <div
                    id="successMessage"
                    class="success-message"
                    role="status"
                    aria-live="polite"
                ></div>


                <!-- Registration Summary -->
                <section
                    id="registrationSummary"
                    class="registration-summary"
                    aria-live="polite"
                >

                    <h2>Registration Summary</h2>

                    <p>
                        <strong>Full Name:</strong>
                        <span id="summaryName"></span>
                    </p>

                    <p>
                        <strong>Student Number:</strong>
                        <span id="summaryStudentNumber"></span>
                    </p>

                    <p>
                        <strong>Email:</strong>
                        <span id="summaryEmail"></span>
                    </p>

                    <p>
                        <strong>Mobile Number:</strong>
                        <span id="summaryMobileNumber"></span>
                    </p>

                    <p>
                        <strong>Course:</strong>
                        <span id="summaryCourse"></span>
                    </p>

                </section>


                <!-- Buttons -->
                <div class="button-group">

                    <button
                        type="submit"
                        id="registerBtn"
                    >
                        Register
                    </button>

                    <button
                        type="reset"
                        id="resetBtn"
                    >
                        Reset
                    </button>

                </div>

            </form>

        </div>

    </main>


    <script src="js/app.js"></script>

</body>
</html>
